[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrosynth"
version = "1.0.0"
description = "Write 16-bit style game music in Python: a from-scratch synthesizer with a live web studio."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["synthesizer", "music", "chiptune", "dsp", "game-audio", "procedural-audio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.25", "ruff>=0.4"]

[project.scripts]
retrosynth = "retrosynth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retrosynth = ["web/*", "examples/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"src/retrosynth/examples/*.py" = ["F403", "F405"]
"src/retrosynth/__init__.py" = ["E402"]
